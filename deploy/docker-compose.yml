name: hackrice

# Deployed by .github/workflows/ci.yml. The .env alongside this file is written
# by the deploy job from GitHub Environment secrets — it is never committed.
#
# IMAGE_TAG is the commit SHA, so every deploy is immutable and rolling back is
# editing one line in .env and re-running `docker compose up -d`.

services:
  api:
    image: ghcr.io/mungbeanbeanie/hackrice-api:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      # Empty until a Managed Postgres cluster exists — nothing reads it yet.
      DATABASE_URL: ${DATABASE_URL:-}
      SERPAPI_API_KEY: ${SERPAPI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # The `cache` service below. Not a secret and identical per environment,
      # so it defaults here rather than being config. `:-` also covers the empty
      # string the deploy job writes when the optional CACHE_URL secret is unset.
      CACHE_URL: ${CACHE_URL:-redis://cache:6379}
    healthcheck:
      # python is in the image already; no need to install curl just for this.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Valkey — the open-source fork of Redis 7.2.4, wire-compatible with it, so
  # the redis-py client in the API image talks to it unchanged.
  #
  # No volume and no port mapping on purpose: everything in here is a cached
  # SerpAPI response or embedding that can be recomputed, and only `api` needs
  # to reach it. Losing the cache on restart costs one slow request.
  cache:
    image: valkey/valkey:alpine
    restart: unless-stopped

  web:
    image: ghcr.io/mungbeanbeanie/hackrice-web:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      # ":80" = plain HTTP on the bare IP. Set a hostname here and Caddy
      # provisions TLS on its own.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Persists issued certificates. Without this, every deploy re-requests
      # from Let's Encrypt and you hit the rate limit.
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
