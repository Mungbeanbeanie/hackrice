name: CI/CD

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

# Superseded PR runs get cancelled to save minutes. Push runs are NOT cancelled:
# they deploy, and killing one mid-deploy leaves the box half-updated.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      # Pinned exactly: setup-uv stopped publishing floating major tags after v7.
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Typecheck
        run: uv run mypy .

      - name: Test
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # These call package.json script names, not tools, so swapping
      # bundler or test runner never touches this workflow.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  # Deploy lives in this file rather than its own so it can simply `needs` the
  # check jobs. A separate workflow would need `workflow_run`, which runs the
  # default branch's copy of the workflow and makes the merge-to-deploy path
  # harder to follow than it deserves to be.
  deploy:
    # DEPLOY_ENABLED is a repository variable, set to "true" once both GitHub
    # Environments have their secrets. Until then this job skips rather than
    # failing red against infrastructure that does not exist yet.
    if: github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    # main -> production box, dev -> staging box. The two GitHub Environments
    # supply different SSH_HOST/DATABASE_URL, so the job body is identical.
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    permissions:
      contents: read
      packages: write
    env:
      # GHCR paths must be lowercase; the owner name is not.
      IMAGE_PREFIX: ghcr.io/mungbeanbeanie/hackrice
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images
        run: |
          docker build -t "$IMAGE_PREFIX-api:$IMAGE_TAG" backend
          docker build -t "$IMAGE_PREFIX-web:$IMAGE_TAG" frontend
          docker push "$IMAGE_PREFIX-api:$IMAGE_TAG"
          docker push "$IMAGE_PREFIX-web:$IMAGE_TAG"

      - name: Deploy over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          COUPON_API: ${{ secrets.COUPON_API }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          CACHE_URL: ${{ secrets.CACHE_URL }}
          SITE_ADDRESS: ${{ vars.SITE_ADDRESS }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # ponytail: trust-on-first-use for the host key. Pin it via an
          # SSH_KNOWN_HOSTS secret if the runner->Vultr path ever needs to be
          # MITM-proof.
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          TARGET="$SSH_USER@$SSH_HOST"

          # Config is version-controlled and pushed each deploy, so the server
          # never becomes the only place a setting lives.
          # Every var docker-compose.yml reads must appear here, or `${FOO:-}`
          # silently resolves to empty on the box even with the secret set.
          printf 'IMAGE_TAG=%s\nDATABASE_URL=%s\nSITE_ADDRESS=%s\nSERPAPI_API_KEY=%s\nOPENAI_API_KEY=%s\nCACHE_URL=%s\nCOUPON_API=%s\nRESEND_API_KEY=%s\nSESSION_SECRET=%s\nADMIN_PASSWORD=%s\n' \
            "$IMAGE_TAG" "$DATABASE_URL" "$SITE_ADDRESS" "$SERPAPI_API_KEY" "$OPENAI_API_KEY" "$CACHE_URL" \
            "$COUPON_API" "$RESEND_API_KEY" "$SESSION_SECRET" "$ADMIN_PASSWORD" > .env

          ssh "$TARGET" 'mkdir -p /srv/hackrice'
          scp deploy/docker-compose.yml .env "$TARGET:/srv/hackrice/"

          # Log the box into GHCR with the run's own short-lived token, piped
          # over stdin — no long-lived registry credential sits on the server.
          printf '%s' "$GHCR_TOKEN" \
            | ssh "$TARGET" "docker login ghcr.io -u ${{ github.actor }} --password-stdin"

          ssh "$TARGET" 'cd /srv/hackrice && docker compose pull && docker compose up -d --remove-orphans && docker image prune -f'

      - name: Smoke test
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SITE_ADDRESS: ${{ vars.SITE_ADDRESS }}
        run: |
          # Once SITE_ADDRESS is a hostname, Caddy redirects :80 -> :443, and
          # curl without -L returns an empty 308 body that never matches below.
          # Test what users actually hit. ":80"-style values stay on the IP.
          URL="http://$SSH_HOST/api/health"
          case "$SITE_ADDRESS" in "" | :*) ;; *) URL="https://$SITE_ADDRESS/api/health" ;; esac

          # A deploy that returns green without the app answering is not a deploy.
          for i in $(seq 1 10); do
            if curl -fsS "$URL" | grep -q '"ok"'; then
              echo "healthy"; exit 0
            fi
            echo "attempt $i: not up yet"; sleep 3
          done
          echo "health check never passed"; exit 1

  # Keeps dev from drifting behind main after a merge. Runs off the check jobs
  # rather than deploy so it still syncs while DEPLOY_ENABLED is unset.
  sync-dev:
    if: github.event_name == 'push' && github.ref_name == 'main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # No checkout: moving one ref does not need a clone, and `git push` from
      # the default shallow clone cannot verify the fast-forward locally — it
      # rejects with "fetch first" even when the push is valid.
      #
      # ponytail: PATCH without `force` is fast-forward-only server-side. It
      # 422s if dev has commits main lacks — real divergence, which wants a PR,
      # not an automatic push. Also never applies to squash-merged PRs, whose
      # commits are not ancestors.
      - name: Fast-forward dev to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PATCH "repos/${{ github.repository }}/git/refs/heads/dev" \
            -f sha=${{ github.sha }}
